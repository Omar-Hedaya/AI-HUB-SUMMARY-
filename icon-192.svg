<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Full-Bleed Royal Blue & Cobalt Gradient -->
    <linearGradient id="bleedBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="25%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Top Gloss & Radial Lighting -->
    <radialGradient id="topGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <!-- Book Drop Shadow for 3D Depth -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1e4f" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#020817" flood-opacity="0.5"/>
    </filter>

    <!-- Soft Glow Filter for Open Book -->
    <filter id="whiteGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#dbeafe" flood-opacity="0.6"/>
    </filter>

    <!-- Book Page Gradient -->
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- 1. 100% FULL-BLEED ROYAL-BLUE GRADIENT (Guarantees zero black letterboxing on Android maskable launcher) -->
  <rect width="512" height="512" fill="url(#bleedBgGrad)"/>

  <!-- 2. Subtle Radial Light from top -->
  <rect width="512" height="512" fill="url(#topGlow)"/>

  <!-- 3. Inner Squircle Highlight for standalone square displays -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#93c5fd" stroke-opacity="0.25" stroke-width="2"/>

  <!-- ============================================================ -->
  <!-- VAST, PROMINENT WHITE OPEN BOOK EMBLEM                        -->
  <!-- Centered horizontally at X=256, vertically at Y=256           -->
  <!-- Lies safely within the 80% circle safe-zone for adaptive mask -->
  <!-- ============================================================ -->
  <g filter="url(#bookShadow)">
    <g filter="url(#whiteGlow)">

      <!-- Left Page: Elegant curved open book wing -->
      <path d="M 252 144
               C 204 128, 134 136, 82 165
               C 77 168, 74 173, 74 179
               L 74 336
               C 74 343, 79 347, 86 345
               C 136 320, 206 312, 252 327
               Z"
            fill="url(#pageGradLeft)"/>

      <!-- Right Page: Symmetrical open book wing -->
      <path d="M 260 144
               C 308 128, 378 136, 430 165
               C 435 168, 438 173, 438 179
               L 438 336
               C 438 343, 433 347, 426 345
               C 376 320, 306 312, 260 327
               Z"
            fill="url(#pageGradRight)"/>

      <!-- Inner Depth / Page Turn Shading Layers (Left Secondary Sheet) -->
      <path d="M 252 160
               C 210 146, 148 155, 102 181
               L 102 325
               C 146 303, 210 295, 252 310
               Z"
            fill="#e2e8f0" fill-opacity="0.35"/>

      <!-- Inner Depth / Page Turn Shading Layers (Right Secondary Sheet) -->
      <path d="M 260 160
               C 302 146, 364 155, 410 181
               L 410 325
               C 366 303, 302 295, 260 310
               Z"
            fill="#e2e8f0" fill-opacity="0.35"/>

      <!-- Spine Center Pillar / Binding -->
      <path d="M 252 142
               C 254 140, 258 140, 260 142
               L 260 330
               C 258 332, 254 332, 252 330
               Z"
            fill="#93c5fd" opacity="0.95"/>

      <!-- Bottom Book Stand / Base Ribbon Chevron -->
      <path d="M 256 332
               L 234 360
               L 256 376
               L 278 360
               Z"
            fill="#38bdf8" opacity="0.95"/>
      <path d="M 256 332
               L 240 354
               L 256 368
               L 272 354
               Z"
            fill="#ffffff" opacity="0.95"/>

      <!-- Left Page Elegant Content Line Accents -->
      <path d="M 120 220 C 162 204, 208 204, 236 213"
            stroke="#93c5fd" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M 120 252 C 162 236, 208 236, 236 245"
            stroke="#93c5fd" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M 136 284 C 172 270, 208 270, 236 277"
            stroke="#93c5fd" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Right Page Elegant Content Line Accents -->
      <path d="M 392 220 C 350 204, 304 204, 276 213"
            stroke="#93c5fd" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M 392 252 C 350 236, 304 236, 276 245"
            stroke="#93c5fd" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M 376 284 C 340 270, 304 270, 276 277"
            stroke="#93c5fd" stroke-width="5.5" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- Sparkle / Knowledge Star Accents Above Book -->
      <path d="M 256 94 L 261 107 L 274 112 L 261 117 L 256 130 L 251 117 L 238 112 L 251 107 Z"
            fill="#ffffff" opacity="0.95"/>
      <circle cx="210" cy="110" r="3.5" fill="#67e8f9" opacity="0.85"/>
      <circle cx="302" cy="110" r="3.5" fill="#67e8f9" opacity="0.85"/>

    </g>
  </g>
</svg>