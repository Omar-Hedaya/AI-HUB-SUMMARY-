<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <linearGradient id="blueGrad192" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="squircleGlow192" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Canvas Backdrop -->
  <rect width="192" height="192" rx="28" fill="url(#bgGrad192)" />

  <!-- Ambient Blue Halo Glow -->
  <rect x="47" y="24" width="98" height="98" rx="28" fill="#2563eb" opacity="0.45" filter="url(#squircleGlow192)" />

