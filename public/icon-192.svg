  <rect x="47" y="24" width="98" height="98" rx="28" fill="url(#blueGrad192)" />

  <!-- Open White Book Icon -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 70 68 L 70 97 C 70 99 71 100 73 100 L 76 100" />
    <path d="M 122 68 L 122 97 C 122 99 121 100 119 100 L 116 100" />
    <path d="M 96 64 C 88 59 80 60 76 62 L 76 96 C 80 94 88 93 96 98 Z" />
    <path d="M 96 64 C 104 59 112 60 116 62 L 116 96 C 112 94 104 93 96 98 Z" />
  </g>

  <!-- Center Bottom Spine Node -->
  <circle cx="96" cy="100" r="3" fill="#ffffff" />

  <!-- Typography -->
  <text x="96" y="156" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
