<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Squircle Vibrant Blue Gradient -->
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Icon Soft Drop Shadow -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- High-Contrast Lettering Glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Canvas Base (Full 512x512) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient Blue Halo Backlight -->
  <rect x="96" y="48" width="320" height="320" rx="90" fill="#2563eb" opacity="0.4" filter="url(#haloGlow)" />

  <!-- Main Royal-Blue Squircle with Luminous Border -->
  <rect x="96" y="48" width="320" height="320" rx="90" fill="url(#squircleGrad)" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Crisp White Open Book Icon Inside Squircle -->
  <g filter="url(#bookShadow)" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Bookmark / Outer Flap -->
    <path d="M 170 188 L 170 278 C 170 284 174 288 180 288 L 192 288" />
    
    <!-- Right Bookmark / Outer Flap -->
    <path d="M 342 188 L 342 278 C 342 284 338 288 332 288 L 320 288" />

    <!-- Left Open Leaf -->
    <path d="M 256 176 C 230 160 200 164 188 170 L 188 274 C 204 268 230 266 256 280 Z" fill="rgba(255,255,255,0.08)" />

    <!-- Right Open Leaf -->
    <path d="M 256 176 C 282 160 312 164 324 170 L 324 274 C 308 268 282 266 256 280 Z" fill="rgba(255,255,255,0.08)" />
  </g>

  <!-- Center Spine Dot -->
  <circle cx="256" cy="286" r="8" fill="#ffffff" />

  <!-- Bold Custom Lettering: AI HUB SUMMARY -->
  <text x="256" y="432" 
        text-anchor="middle" 
        fill="#ffffff" 
        filter="url(#textGlow)"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="34" 
        letter-spacing="2.5">AI HUB SUMMARY</text>
</svg>
